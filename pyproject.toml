[project]
name = "team4-work-agents"
version = "0.1.0"
description = "C/S, TFT and shared platform API services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "google-genai>=1,<3",
  "httpx>=0.27,<1",
  "msal>=1.31,<2",
  "mypy>=1.19,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "infra/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
files = ["backend"]

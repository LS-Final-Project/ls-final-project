name: Application checks
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
  actions: read
# PR의 이전 실행만 취소한다. dev/main의 각 SHA 검증은 보존한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.plan.outputs.backends }}
      frontend: ${{ steps.plan.outputs.frontend }}
      infrastructure: ${{ steps.plan.outputs.infrastructure }}
      evaluation: ${{ steps.plan.outputs.evaluation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --last-successful-branch "$BRANCH" --github-output "$GITHUB_OUTPUT"
          fi
  backend:
    needs: changes
    if: needs.changes.outputs.backends != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.backends) }}
    name: backend-${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Run backend checks with cached dependencies
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          build-args: TEST_SERVICE=${{ matrix.service }}
          # 의존성만 재사용하고 테스트는 매 실행마다 수행한다.
          no-cache-filters: test
          cache-from: type=gha,scope=backend-${{ matrix.service }}-test
          cache-to: type=gha,scope=backend-${{ matrix.service }}-test,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          build-args: SERVICE_NAME=${{ matrix.service }}
          load: true
          tags: team4-service
          cache-from: type=gha,scope=backend-${{ matrix.service }}-runtime
          cache-to: type=gha,scope=backend-${{ matrix.service }}-runtime,mode=max
      - run: docker run --rm --network=none team4-service python -c 'import importlib,os; from backend.shared.ai import AISettings; assert AISettings().ai_provider=="gemini"; app=importlib.import_module("backend.api."+os.environ["SERVICE_NAME"]+".main").create_app(); assert app.state.settings.environment=="production"'
      - name: Build evaluation worker image
        if: matrix.service == 'platform'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: evaluation-worker
          build-args: SERVICE_NAME=platform
          load: true
          tags: team4-evaluation-worker
          cache-from: type=gha,scope=backend-platform-worker
          cache-to: type=gha,scope=backend-platform-worker,mode=max
      - if: matrix.service == 'platform'
        run: |
          docker run --rm --network=none --entrypoint python team4-evaluation-worker -c 'import os,subprocess; from eval.smoke import FakeProvider; assert os.getuid()==10001; assert FakeProvider().generate("synthetic")[0]; result=subprocess.run(["python","-m","backend.api.platform.evaluations.job_worker"],env=os.environ|{"EVALUATION_RUN_ID":"11111111-1111-4111-8111-111111111111"},capture_output=True,text=True,timeout=10); assert result.returncode!=0 and result.stderr.strip()=="SMOKE_WORKER_DISABLED"'
      - name: Build C/S worker image
        if: matrix.service == 'cs'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: cs-worker
          build-args: SERVICE_NAME=cs
          load: true
          tags: team4-cs-worker
          cache-from: type=gha,scope=backend-cs-worker
          cache-to: type=gha,scope=backend-cs-worker,mode=max
      - if: matrix.service == 'cs'
        run: |
          docker run --rm --network=none --entrypoint python team4-cs-worker -c 'import os,subprocess; from backend.agent.ticket_source_registry import policy_info_codes; assert os.getuid()==10001; assert policy_info_codes(); result=subprocess.run(["python","-m","backend.agent.cs_worker"],env=os.environ|{"CS_JOB_ID":"11111111-1111-4111-8111-111111111111"},capture_output=True,text=True,timeout=30); assert result.returncode!=0 and result.stderr.strip()=="CS_WORKER_DISABLED", result.stderr[-300:]'
      - name: Build RFP worker image
        if: matrix.service == 'tft'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: tft-worker
          build-args: SERVICE_NAME=tft
          load: true
          tags: team4-tft-worker
          cache-from: type=gha,scope=backend-tft-worker
          cache-to: type=gha,scope=backend-tft-worker,mode=max
      - if: matrix.service == 'tft'
        run: |
          docker run --rm --network=none --entrypoint python team4-tft-worker -c 'import os,subprocess; assert os.getuid()==10001; assert not os.path.exists("backend/api/platform") and not os.path.exists("backend/api/cs"); result=subprocess.run(["python","-m","backend.agent.tft_worker"],env=os.environ|{"TFT_JOB_ID":"11111111-1111-4111-8111-111111111111"},capture_output=True,text=True,timeout=30); assert result.returncode!=0 and result.stderr.strip()=="TFT_WORKER_DISABLED", result.stderr[-300:]'
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm test --prefix frontend && npm run build --prefix frontend
  auth-database:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.backends), 'platform') || contains(fromJSON(needs.changes.outputs.backends), 'cs') || contains(fromJSON(needs.changes.outputs.backends), 'tft') || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kan77_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/kan77_auth_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen python scripts/check_db_tests.py
      - run: uv run --frozen pytest -q tests/platform/test_authorization_store.py tests/platform/test_session_store.py tests/platform/test_mailbox_vault.py tests/platform/test_microsoft_oauth.py tests/platform/test_mailbox_http.py tests/platform/test_mailbox_browser.py tests/platform/test_login_http.py tests/platform/test_session_context.py tests/platform/test_business_relay.py tests/platform/test_assignees_db.py tests/platform/test_security_regression_index.py tests/platform/test_resilience_regression_index.py tests/cs/test_cs_full_flow_db.py tests/cs/test_cs_flow_regression_index.py tests/platform/test_job_resilience_db.py tests/platform/test_job_admission.py tests/platform/test_dispatch_ledger.py tests/platform/test_local_dispatch_target_db.py tests/platform/test_jobs_transport.py tests/platform/test_job_status.py tests/platform/test_job_events.py tests/platform/test_web_job_events.py tests/platform/test_evaluation_admission.py tests/platform/test_evaluation_lists_db.py tests/platform/test_evaluation_registration_db.py tests/platform/test_smoke_worker.py tests/platform/test_cs_smoke_storage.py tests/platform/test_job_worker.py tests/platform/test_run_controls.py tests/platform/test_mail_graph.py tests/platform/test_mail_sync_db.py tests/platform/test_mail_triage_db.py tests/platform/test_mail_worker_db.py tests/platform/test_mail_send_db.py tests/platform/test_mail_send_worker_db.py tests/platform/test_mail_send_http_db.py tests/platform/test_mail_links_db.py tests/platform/test_mail_intake_db.py tests/cs/test_customer_mail_db.py tests/cs/test_worker_source_db.py tests/cs/test_analysis_jobs_db.py tests/cs/test_analysis_db.py tests/cs/test_ticket_list_db.py tests/cs/test_summary_db.py tests/cs/test_units_db.py tests/cs/test_seed_units_db.py tests/cs/test_workflow_db.py tests/cs/test_workflow_cases_db.py tests/cs/test_candidate_after_case_db.py tests/cs/test_improvements_db.py tests/cs/test_improvement_transitions_db.py tests/cs/test_improvement_followups_db.py tests/cs/test_stats_db.py tests/cs/test_comparisons_db.py tests/cs/test_comparison_writes_db.py tests/cs/test_cs_search_index_db.py tests/cs/test_graph_db.py tests/cs/test_cs_runner_db.py tests/cs/test_evidence_build_db.py tests/platform/test_eval_import_run_db.py tests/tft/test_search_index_db.py tests/tft/test_rfp_schema_db.py tests/tft/test_rfp_http_base_db.py tests/tft/test_rfp_routes_db.py tests/tft/test_rfp_jobs_db.py tests/tft/test_worker_processor_db.py tests/tft/test_rfp_regrading_db.py tests/platform/test_tft_jobs_db.py tests/platform/test_cs_jobs_db.py tests/platform/test_cs_job_runtime_db.py tests/platform/test_cs_worker_db.py tests/platform/test_cs_analysis_e2e_db.py tests/platform/test_tft_job_runtime_db.py tests/platform/test_tft_worker_db.py tests/cs/test_index_docs_db.py tests/cs/test_improvement_candidates_db.py tests/platform/test_notification_events_db.py tests/platform/test_notification_push_db.py tests/platform/test_notifications_db.py tests/tft/test_rfp_draft_routes_db.py tests/tft/test_rfp_write_routes_db.py tests/tft/test_a09_demo_flow_db.py tests/tft/test_q05_proposals_flow_db.py tests/tft/test_a09_rnd_path_db.py
  infrastructure:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check infra scripts
      - run: uv run --frozen ruff format --check infra scripts
      - run: python3 -m unittest discover -s infra/tests -q
      - run: uv run --frozen python -m unittest discover -s scripts/tests -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Test PR automation
        run: node --test .github/tests/*.test.cjs
      - name: Test local business web adapter
        run: node --test scripts/local_business/local_web.test.mjs
      - name: Verify fresh local database initialization
        timeout-minutes: 5
        env:
          LOCAL_DB_ADMIN_PASSWORD: ci-admin-only
          LOCAL_CS_PASSWORD: ci-cs-only
          LOCAL_TFT_PASSWORD: ci-tft-only
          LOCAL_PLATFORM_PASSWORD: ci-platform-only
          LOCAL_DB_PORT: '55433'
        run: |
          test -x infra/local/init.sh
          bash -n infra/local/init.sh
          compose=(docker compose --env-file /dev/null --project-name kan102-init-check)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up -d --wait --wait-timeout 120 db
          "${compose[@]}" exec -T db psql -X -U postgres -d team4 -v ON_ERROR_STOP=1 -f /setup/sql/002_verify_service_roles.sql
          initialized=$("${compose[@]}" exec -T db psql -X -U postgres -d team4 -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT count(*) FROM identity.users) = 4 AND (SELECT count(*) FROM identity.user_roles) = 4 AND EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')")
          test "$initialized" = t
  evaluation:
    needs: changes
    if: needs.changes.outputs.evaluation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen python scripts/check_backend.py eval
  secrets:
    # 키·토큰이 커밋에 섞였는지 모든 이력에서 본다(KAN-165). 변경 경로와 상관없이 늘 돈다. 출력은 값을 가린다.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # 공식 릴리스 체크섬 파일과 GitHub 자산 digest가 일치한 값(2026-10-31 확인).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1 \
            --log-opts="--all" .
  required:
    name: Application result
    if: always()
    needs: [changes, backend, frontend, auth-database, infrastructure, evaluation, secrets]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYRESULT'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success'
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          PYRESULT

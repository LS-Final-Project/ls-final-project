name: Jira PR metadata

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jira-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # 신뢰한 기본 브랜치(현재 dev)에서 스크립트와 설정을 함께 읽는다. 임의 PR head는 실행하지 않는다.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const automation = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/pr_metadata.cjs');
            const config = require(process.env.GITHUB_WORKSPACE + '/.github/jira-config.json');
            await automation.run({ github, context, core, config });

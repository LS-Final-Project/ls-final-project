name: Jira PR metadata

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jira-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Only trusted base code is used in this job, never the PR head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const automation = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/pr_metadata.cjs');
            const config = require(process.env.GITHUB_WORKSPACE + '/.github/jira-reviewers.json');
            await automation.run({ github, context, core, config });

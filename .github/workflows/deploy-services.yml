name: Deploy changed services
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    if: >-
      vars.GCP_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      services: ${{ steps.plan.outputs.services }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      # A workflow_run uses the default branch's identity. Starting on main itself
      # preserves the existing main-only OIDC trust even when dev is the default.
      - name: Wait for this main commit to pass CI
        run: python3 infra/release.py wait-ci --revision "$REVISION"
        env:
          REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: release-orchestrator@proj-skkuls0106-183255377938.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - id: plan
        run: python3 infra/release.py plan --github-output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM4_GCLOUD_ACCOUNT: release-orchestrator@proj-skkuls0106-183255377938.iam.gserviceaccount.com
  service:
    needs: plan
    if: needs.plan.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    name: deploy-${{ matrix.service }}
    concurrency:
      group: deploy-${{ matrix.service }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ needs.plan.outputs.revision }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: release-orchestrator@proj-skkuls0106-183255377938.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - run: python3 infra/release.py run --service "$SERVICE" --revision "$REVISION"
        env:
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ needs.plan.outputs.revision }}
          TEAM4_GCLOUD_ACCOUNT: release-orchestrator@proj-skkuls0106-183255377938.iam.gserviceaccount.com

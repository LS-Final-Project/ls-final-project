name: Claude Code Review

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # 토큰을 사용하는 실행에서는 PR 코드를 실행하지 않는다.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Request and validate Cloud Routine review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CLAUDE_REVIEW_ROUTINE_URL: ${{ secrets.CLAUDE_REVIEW_ROUTINE_URL }}
          CLAUDE_REVIEW_ROUTINE_TOKEN: ${{ secrets.CLAUDE_REVIEW_ROUTINE_TOKEN }}
        with:
          retries: 0
          script: |
            const prepared = await require('./.github/scripts/ai_review.cjs').prepare({github, context, core});
            await require('./.github/scripts/routine_review.cjs').run({
              github, context, core, prepared,
              url: process.env.CLAUDE_REVIEW_ROUTINE_URL,
              token: process.env.CLAUDE_REVIEW_ROUTINE_TOKEN
            });

# KAN-165 비밀값 검사 설정. 기본 규칙을 그대로 쓰고, 검사용 가짜 값만 좁게 허용한다.
# 허용을 넓히기 전에 그 값이 정말 가짜인지(실제 계정·서비스에서 쓰이지 않는지) 확인한다.
[extend]
useDefault = true

# generic-api-key는 이름에 key·token·secret이 든 변수의 값을 엔트로피로 잡는다. 이 저장소에서 걸린 10건은 모두
# 소문자 단어를 -·_로 이은 이름표였다(urgency_macro_f1, cs-comparison-key-v1, admission-key-123,
# fixture-server-token, lsv2-fixture-secret, 2026-10-31 확인). 실제 키는 대소문자·숫자가 섞인 임의 문자열이라
# 이 모양만 허용한다. 각 단어는 글자만이거나 4자 이하여야 해서 UUID·16진수 토큰(a1b2c3d4-…)은 걸린다.
# 다른 규칙(Google API 키, 개인 키, 토큰 형식 등)에는 적용하지 않는다.
[[allowlists]]
description = "generic-api-key: 소문자 단어를 이은 이름표"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(?:[a-z]+|[a-z0-9]{1,4})(?:[_-](?:[a-z]+|[a-z0-9]{1,4}))+$''']

# 로그 가림 검사가 쓰는 짧은 가짜 Google 액세스 토큰 조각. 실제 토큰은 100자가 넘는다.
[[allowlists]]
description = "tests/test_logs.py의 가짜 토큰 조각"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_logs\.py$''']
regexTarget = "secret"
regexes = ['''^ya29\.a0AfH6SMB$''']

# 허용 규칙 검사(.github/tests/application_checks.test.cjs)가 "실제 키 모양은 받지 않는다"를 보이려고 지어낸
# Google API 키 모양 값. 실제 키가 아니다. 이 파일의 이 값 하나만 허용한다.
[[allowlists]]
description = "허용 규칙 검사용으로 지어낸 Google API 키 모양 값"
targetRules = ["gcp-api-key"]
paths = ['''^\.github/tests/application_checks\.test\.cjs$''']
regexTarget = "secret"
regexes = ['''^AIzaSyA1b2C3d4E5f6G7h8I9j0KlMnOpQrStUvW$''']

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C/S · RFP 서비스 아키텍처</title>
<!-- README용 PNG 원본. 브라우저에서 1600×1000, 배율 1로 캡처한다. 외부 폰트·리소스 없이 렌더링한다. -->
<style>
  html, body { margin: 0; width: 1600px; height: 1000px; background: #fff; }
  svg { display: block; font-family: "NanumSquare", "Noto Sans KR", sans-serif; }
  text { fill: #202c40; }
  .heading { font-size: 29px; font-weight: 800; }
  .detail { font-size: 22px; fill: #54647a; }
  .small { font-size: 19px; fill: #627188; }
  .edge { fill: none; stroke: #8c9bb0; stroke-width: 2.5; stroke-linejoin: round; }
  .async { stroke-dasharray: 7 6; }
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">C/S · RFP 서비스 아키텍처</title>
  <desc id="description">사용자는 공개된 통합 웹을 통해 공통 플랫폼에 접근한다. 플랫폼은 로그인과 메일을 담당하고 C/S와 RFP API로 요청을 중계한다. 긴 작업은 Cloud Run Jobs에서 처리한다. 업무 API와 worker는 Gemini를 호출하며, API와 worker는 데이터와 파일 저장소를 사용한다. AI가 준비한 결과는 사람이 최종 확인한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8c9bb0"/></marker>
  </defs>

  <text x="60" y="72" font-size="40" font-weight="800">C/S · RFP 서비스 아키텍처</text>
  <text x="60" y="112" class="detail">하나의 웹에서 두 업무를 연결합니다.</text>
  <rect x="1060" y="44" width="480" height="52" rx="26" fill="#fff4e5"/>
  <text x="1300" y="77" text-anchor="middle" font-size="23" font-weight="700" fill="#9b5a12">AI는 분석·초안, 최종 확인은 사람</text>

  <!-- 서비스 경계: 통합 웹만 공개, 세 API는 내부 호출 -->
  <rect x="285" y="265" width="935" height="325" rx="24" fill="#f7f9fc" stroke="#e0e6ef"/>
  <text x="310" y="300" class="small">Google Cloud Run · 서울</text>
  <text x="1190" y="300" text-anchor="end" class="small">웹만 공개 · API는 내부 호출</text>

  <!-- 연결선을 먼저 그려 상자와 글자 위로 지나가지 않도록 한다. -->
  <path d="M240 445 H315" class="edge" marker-end="url(#arrow)"/>
  <path d="M525 445 H595" class="edge" marker-end="url(#arrow)"/>
  <path d="M845 445 H880 V385 H915" class="edge" marker-end="url(#arrow)"/>
  <path d="M880 445 V520 H915" class="edge" marker-end="url(#arrow)"/>
  <path d="M720 345 V240" class="edge" marker-end="url(#arrow)"/>
  <path d="M650 545 V660" class="edge async" marker-end="url(#arrow)"/>
  <path d="M790 545 V625 H1070 V660" class="edge async" marker-end="url(#arrow)"/>
  <path d="M1185 385 H1250 V445 H1310" class="edge" marker-end="url(#arrow)"/>
  <path d="M1185 520 H1250 V445" class="edge"/>
  <path d="M845 715 H875 V800 H1250 V520" class="edge"/>
  <circle cx="1250" cy="445" r="4" fill="#8c9bb0"/>
  <circle cx="1250" cy="520" r="4" fill="#8c9bb0"/>

  <rect x="60" y="385" width="180" height="120" rx="18" fill="#fff" stroke="#d9e0ea" stroke-width="2"/>
  <text x="150" y="435" text-anchor="middle" class="heading">사용자</text>
  <text x="150" y="472" text-anchor="middle" class="detail">브라우저</text>

  <rect x="315" y="365" width="210" height="160" rx="18" fill="#fff" stroke="#95b4e6" stroke-width="2"/>
  <text x="420" y="421" text-anchor="middle" class="heading">통합 웹</text>
  <text x="420" y="461" text-anchor="middle" class="detail">C/S · RFP 화면</text>
  <text x="420" y="497" text-anchor="middle" class="small">React</text>

  <rect x="595" y="345" width="250" height="200" rx="18" fill="#f2edff" stroke="#ab94db" stroke-width="2"/>
  <text x="720" y="401" text-anchor="middle" class="heading">공통 플랫폼</text>
  <text x="720" y="445" text-anchor="middle" class="detail">로그인 · 권한 · 메일</text>
  <text x="720" y="480" text-anchor="middle" class="detail">업무 요청 중계</text>
  <text x="720" y="519" text-anchor="middle" class="small">FastAPI</text>

  <rect x="915" y="330" width="270" height="110" rx="18" fill="#eaf2ff" stroke="#83a9e9" stroke-width="2"/>
  <text x="1050" y="373" text-anchor="middle" class="heading">C/S API</text>
  <text x="1050" y="412" text-anchor="middle" class="detail">문의 · 회신 · 개선요청</text>
  <rect x="915" y="465" width="270" height="110" rx="18" fill="#eaf7f3" stroke="#81b9aa" stroke-width="2"/>
  <text x="1050" y="508" text-anchor="middle" class="heading">RFP API</text>
  <text x="1050" y="547" text-anchor="middle" class="detail">요구 비교 · 보완 방안</text>

  <!-- 외부 연동은 서비스당 역할 한 줄로 요약 -->
  <rect x="595" y="150" width="250" height="90" rx="18" fill="#fff" stroke="#d9e0ea" stroke-width="2"/>
  <text x="720" y="187" text-anchor="middle" class="heading">Microsoft</text>
  <text x="720" y="220" text-anchor="middle" class="detail">로그인 · 메일 연동</text>
  <rect x="1310" y="385" width="230" height="120" rx="18" fill="#f2edff" stroke="#c5b4e9" stroke-width="2"/>
  <text x="1425" y="435" text-anchor="middle" class="heading">Gemini</text>
  <text x="1425" y="473" text-anchor="middle" class="detail">AI 분석 · 초안</text>

  <!-- 백그라운드 처리: 업무 분석과 메일 큐를 구분 -->
  <text x="310" y="697" font-size="24" font-weight="700">백그라운드 처리</text>
  <line x1="310" y1="727" x2="350" y2="727" class="edge async"/>
  <text x="365" y="733" class="small">비동기 작업</text>
  <rect x="535" y="660" width="310" height="110" rx="18" fill="#fff" stroke="#ab94db" stroke-width="2"/>
  <text x="690" y="704" text-anchor="middle" class="heading">Cloud Run Jobs</text>
  <text x="690" y="743" text-anchor="middle" class="detail">C/S 분석 · RFP 문서 처리</text>
  <rect x="915" y="660" width="270" height="110" rx="18" fill="#fff" stroke="#ab94db" stroke-width="2"/>
  <text x="1050" y="704" text-anchor="middle" class="heading">Cloud Tasks</text>
  <text x="1050" y="743" text-anchor="middle" class="detail">메일 수집 · 발송 큐</text>

  <!-- 공통 데이터 계층. 세부 접근선은 생략하고 사용 주체를 명시한다. -->
  <rect x="285" y="825" width="1255" height="120" rx="20" fill="#f7f9fc" stroke="#e0e6ef"/>
  <text x="315" y="876" font-size="25" font-weight="800">데이터 · 파일</text>
  <text x="315" y="911" class="small">API · worker가 사용</text>
  <line x1="530" y1="850" x2="530" y2="920" stroke="#d9e0ea" stroke-width="2"/>
  <text x="565" y="875" class="heading">Cloud SQL · PostgreSQL</text>
  <text x="565" y="912" class="detail">업무 데이터 · 검색 · 작업 상태</text>
  <line x1="1020" y1="850" x2="1020" y2="920" stroke="#d9e0ea" stroke-width="2"/>
  <text x="1060" y="875" class="heading">Cloud Storage</text>
  <text x="1060" y="912" class="detail">메일 첨부 · RFP 원문 · 검토본</text>
</svg>
</body>
</html>
